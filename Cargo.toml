[workspace]
resolver = "2"
members = [
    "crates/audio-core",
    "crates/audio-slicer",
    "crates/min-label",
    "crates/slur-cutter",
    "crates/lyric-fa",
    "crates/hubert-fa",
    "crates/some-infer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Dataset Tools Contributors"]
repository = "https://github.com/HuanLinOTO/dataset-tools"

[workspace.dependencies]
# GUI - To be implemented with gpui in future updates
# gpui = { git = "https://github.com/zed-industries/zed", tag = "v0.179.5" }

# Audio processing
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
hound = "3.5"
rubato = "0.15"

# Math and algorithms
ndarray = "0.16"
rustfft = "6.2"

# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
once_cell = "1.20"
parking_lot = "0.12"
